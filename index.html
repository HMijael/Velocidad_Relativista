<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentacion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="player-wrapper">
        <div class="video-container" id="videoContainer">
            <video id="videoPlayer" src="relatividad.mp4" preload="metadata"></video>

            <!-- Indicador de estado Play (Círculo blanco pequeño) -->
            <div class="play-indicator" id="playIndicator" aria-hidden="true"></div>

            <!-- Zona de control inferior izquierda: Play / Pause y Reiniciar -->
            <div class="control-zone zone-left">
                <button id="playPauseBtn" class="control-btn" aria-label="Reproducir o pausar">
                    <svg id="iconPlay" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="iconPause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="hidden">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <button id="restartBtn" class="control-btn" aria-label="Reiniciar video">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>

            <!-- Zona de control inferior derecha: Pantalla completa -->
            <div class="control-zone zone-right">
                <button id="fullscreenBtn" class="control-btn" aria-label="Pantalla completa">
                    <svg id="iconExpand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                    <svg id="iconCompress" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
